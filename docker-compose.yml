services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: ticketrush-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7.0
    container_name: ticketrush-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ticketrush
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ticketrush --quiet
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ticketrush-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ticketrush
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=ticketrush-dev-secret-super-key-32chars
      - HOLD_TTL_SECONDS=300
      - MAX_SEATS_PER_HOLD=6
      - QUEUE_ADMIT_RATE=50
      - QUEUE_ADMIT_WINDOW_SECONDS=5
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: npm run dev

volumes:
  redis_data:
  mongo_data:
